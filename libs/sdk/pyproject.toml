[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
    "httpx2-pytest>=2.0.0,<3",
    "mypy>=1.15.0,<2",
    "pre-commit>=4.2.0,<5",
    "pytest-asyncio>=1.0.0,<2",
    "pytest-env>=1.1.5,<2",
    "pytest>=9.0.0,<10",
    "ruff>=0.11.5,<0.12",
    "uvloop>=0.22.0",
]

[project]
authors = [
    {email = "adam@futureevidence.org", name = "Adam Hamilton"},
    {email = "andrew@futureevidence.org", name = "Andrew Harvey"},
    {email = "daniel@futureevidence.org", name = "Daniel Breves"},
    {email = "jack@futureevidence.org", name = "Jack Walmisley"},
    {email = "tim.repke@pik-potsdam.de", name = "Tim Repke"},
]
dependencies = [
    "authlib>=1.9.2,<2",
    "cachetools>=5.5.2,<6",
    "certifi>=2026.10.19",
    "fastapi>=0.119.1",
    "httpx2>=2.16.0,<3",
    "msal>=1.34.0",
    "pydantic>=2.12.5,<3",
]
description = "A software development kit (sdk) to support interaction with the DESTINY repository"
license = "Apache-2.0"
name = "destiny_sdk"
readme = "README.md"
requires-python = ">=3.12, <4"
version = "0.18.1"

[project.optional-dependencies]
labs = []

[tool.pytest.ini_options]
addopts = ["--color=yes", "--import-mode=importlib", "--verbose"]
env = ["ENV=test"]
norecursedirs = ["tests/e2e"]
pythonpath = "."
testpaths = ["tests"]
