name: Deploy to Azure

concurrency:
  # No parallel deployments in the same environment
  group: ${{ github.workflow }}-${{ inputs.environment }}
  # Automated workflows have their own concurrency limitations
  # so allow cancellation of this workflow if manually triggered.
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: environment to deploy to
        required: true
      image_tag:
        type: string
        description: image tag to deploy
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-application:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: "Az CLI login"
        uses: azure/login@v2.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy built image to app container
        uses: Azure/container-apps-deploy-action@v1
        with:
          acrName: ${{vars.REGISTRY_NAME}}
          containerAppName: ${{vars.CONTAINER_APP_NAME}}
          resourceGroup: ${{vars.RESOURCE_GROUP}}
          containerAppEnvironment: ${{vars.CONTAINER_APP_ENV}}
          imageToDeploy: ${{vars.REGISTRY_NAME}}.azurecr.io/${{vars.APP_NAME}}:${{ inputs.image_tag }}

      - name: Deploy built image to tasks container
        uses: Azure/container-apps-deploy-action@v1
        with:
          acrName: ${{vars.REGISTRY_NAME}}
          containerAppName: ${{vars.CONTAINER_APP_TASKS_NAME}}
          resourceGroup: ${{vars.RESOURCE_GROUP}}
          containerAppEnvironment: ${{vars.CONTAINER_APP_ENV}}
          imageToDeploy: ${{vars.REGISTRY_NAME}}.azurecr.io/${{vars.APP_NAME}}:${{ inputs.image_tag }}

  deploy-container-apps-jobs:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: "Az CLI login"
        uses: azure/login@v2.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update scheduled container app jobs images
        uses: Azure/cli@v2.0.0
        with:
          inlineScript: |
            JOBS=$(az containerapp job list \
              --resource-group ${{vars.RESOURCE_GROUP}} \
              --query "[?tags.app=='${{vars.APP_NAME}}' && tags.environment=='${{ inputs.environment }}' && tags.\"job-type\"=='scheduled'].name" \
              --output tsv)

            if [ -z "$JOBS" ]; then
              echo "No scheduled jobs found"
              exit 0
            fi

            for JOB_NAME in $JOBS; do
              echo "Updating job: $JOB_NAME"
              az containerapp job update \
                --name "$JOB_NAME" \
                --resource-group ${{vars.RESOURCE_GROUP}} \
                --image ${{vars.REGISTRY_NAME}}.azurecr.io/${{vars.APP_NAME}}:${{ inputs.image_tag }}
            done

      - name: Update database migrator job image and command
        uses: Azure/cli@v2.0.0
        with:
          inlineScript: |
            az containerapp job update \
              --name "db-migrator-${{ vars.ENVIRONMENT_NAME }}" \
              --resource-group ${{vars.RESOURCE_GROUP}} \
              --image ${{vars.REGISTRY_NAME}}.azurecr.io/${{vars.APP_NAME}}:${{ inputs.image_tag }} \
              --command alembic upgrade head

      - name: Update elasticsearch index migrator job image and command
        uses: Azure/cli@v2.0.0
        with:
          inlineScript: |
            az containerapp job update \
              --name "es-index-migrator-${{ vars.ENVIRONMENT_NAME }}" \
              --resource-group ${{vars.RESOURCE_GROUP}} \
              --image ${{vars.REGISTRY_NAME}}.azurecr.io/${{vars.APP_NAME}}:${{ inputs.image_tag }} \
              --command echo "Empty Command"
          # We reset the command to empty as the azure portal has a poor manual command update UI.
          # So we want the default container command to be something that doesn't trigger a migration.

  build-ui:
    # Always rebuilds: Vite bakes environment-specific values (API URL, Keycloak
    # config) into the bundle at build time, so unlike the API image a staging
    # build can't be promoted to production.
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: image_tag is a short sha, which a shallow clone can't
          # resolve.
          fetch-depth: 0
          sparse-checkout: ui

      # Build from the commit being deployed rather than the workflow's ref, so
      # a rollback takes the UI back along with the API.
      - name: Check out the commit being deployed
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: git checkout --detach "$IMAGE_TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci

      - name: Build UI
        working-directory: ./ui
        env:
          VITE_API_BASE: ${{ vars.UI_API_BASE }}
          VITE_KEYCLOAK_URL: ${{ vars.UI_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ vars.UI_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ vars.UI_KEYCLOAK_CLIENT_ID }}
        run: npm run build

      - name: Upload UI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  deploy-ui:
    runs-on: ubuntu-latest
    needs: build-ui
    environment: ${{ inputs.environment }}
    steps:
      - name: "Az CLI login"
        uses: azure/login@v2.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download UI artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: dist

      - name: Deploy UI to blob storage
        uses: Azure/cli@v2.0.0
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name ${{ vars.UI_STORAGE_ACCOUNT_NAME }} \
              --destination '$web' \
              --source ./dist \
              --overwrite true

      - name: Purge Front Door cache for the UI
        uses: Azure/cli@v2.0.0
        with:
          inlineScript: |
            az afd endpoint purge \
              --resource-group ${{ vars.FRONTDOOR_RESOURCE_GROUP }} \
              --profile-name ${{ vars.FRONTDOOR_PROFILE_NAME }} \
              --endpoint-name ${{ vars.FRONTDOOR_ENDPOINT_NAME }} \
              --domains ${{ vars.UI_CUSTOM_DOMAIN }} \
              --content-paths "/*" \
              --no-wait

  verify-deployment:
    runs-on: ubuntu-latest
    needs:
      - deploy-application
    environment: ${{ inputs.environment }}
    strategy:
      # Report every unhealthy app, not just the first.
      fail-fast: false
      matrix:
        # We have to do this lookup as `strategy` cannot see ENV vars
        app_var:
          - CONTAINER_APP_NAME
          - CONTAINER_APP_TASKS_NAME
    steps:
      - name: "Az CLI login"
        uses: azure/login@v2.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The deploy jobs return once Azure accepts the new revision, not once it is
      # serving, so a replica that never starts would otherwise report a green deploy.
      - name: Wait for latest revision to be running
        uses: Azure/cli@v2.0.0
        with:
          inlineScript: |
            APP="${{ vars[matrix.app_var] }}"

            if [ -z "$APP" ]; then
              echo "::error::${{ matrix.app_var }} is unset"
              exit 1
            fi

            APP_ID=$(az containerapp show --name "$APP" \
              --resource-group ${{vars.RESOURCE_GROUP}} --query id --output tsv)
            REVISION=$(az containerapp show --name "$APP" \
              --resource-group ${{vars.RESOURCE_GROUP}} \
              --query properties.latestRevisionName --output tsv)

            echo "Waiting for $APP revision $REVISION"
            az resource wait \
              --ids "$APP_ID/revisions/$REVISION" \
              --custom "properties.runningState=='Running'" \
              --interval 10 \
              --timeout 300

      - name: Show replica state on failure
        if: failure()
        uses: Azure/cli@v2.0.0
        with:
          inlineScript: |
            az containerapp replica list \
              --name "${{ vars[matrix.app_var] }}" \
              --resource-group ${{vars.RESOURCE_GROUP}}

  migrate-database:
    runs-on: ubuntu-latest
    needs: deploy-container-apps-jobs
    environment: ${{ inputs.environment }}
    steps:
      - name: "Az CLI login"
        uses: azure/login@v2.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Trigger database migrations
        uses: Azure/cli@v2.0.0
        with:
          inlineScript: |
            az containerapp job start \
              --name "db-migrator-${{ vars.ENVIRONMENT_NAME }}" \
              --resource-group ${{vars.RESOURCE_GROUP}}

  notify:
    if: ${{ always() && inputs.environment == 'production' }}
    needs:
      - verify-deployment
      - deploy-ui
      - migrate-database
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      STATUS: >-
        ${{ (contains(needs.*.result, 'failure') && '🚨 DEPLOY FAILED')
        || (contains(needs.*.result, 'skipped') && '🚨 DEPLOY FAILED')
        || (contains(needs.*.result, 'cancelled') && '⚠️ Deploy cancelled')
        || '✅ Deployed' }}
    steps:
      - name: Notify Slack of deploy result
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.CI_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # The action swallows delivery errors by default; fail loudly instead.
          errors: true
          # github.workflow distinguishes a promotion from a rollback.
          payload: |
            blocks:
              - type: header
                text:
                  type: plain_text
                  emoji: true
                  text: "${{ env.STATUS }} - ${{ vars.APP_NAME }} (${{ inputs.environment }})"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Image tag:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ inputs.image_tag }}|${{ inputs.image_tag }}>"
                  - type: mrkdwn
                    text: "*Triggered by:*\n${{ github.triggering_actor }}"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "${{ github.workflow }} · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
